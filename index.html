<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUNOVRA LIBRARY | المكتبة الرقمية الشاملة</title>
    <meta name="monetag" content="3f4088c86eb10f970c25df2fc645fcca">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #c5a059;
            --gold-bright: #ffdfa0;
            --dark: #0a0a0a;
            --dark-card: #141414;
            --white: #ffffff;
            --transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark); color: var(--white); overflow-x: hidden; min-height: 100vh; }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); display: flex; justify-content: center; align-items: center; z-index: 10000;
            transition: opacity 0.8s ease;
        }
        .loader-logo { font-family: 'Cinzel', serif; font-size: 35px; color: var(--gold); letter-spacing: 8px; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        header { 
            position: sticky; top: 0; z-index: 2000; background: rgba(10, 10, 10, 0.95); 
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3); backdrop-filter: blur(10px);
        }
        .logo-text { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold); letter-spacing: 3px; }

        .hero-banner { text-align: center; padding: 30px 15px 20px; background: linear-gradient(180deg, rgba(197, 160, 89, 0.1) 0%, rgba(10,10,10,0) 100%); }
        .hero-banner h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 2rem; margin-bottom: 8px; }
        .hero-banner p { color: #aaa; font-size: 0.95rem; margin-bottom: 20px; }

        .search-container { max-width: 500px; margin: 0 auto; position: relative; }
        .search-input { 
            width: 100%; background: var(--dark-card); border: 1px solid var(--gold); 
            color: #fff; padding: 12px 20px; border-radius: 25px; font-size: 0.95rem; 
            outline: none; transition: var(--transition);
        }
        .search-input:focus { box-shadow: 0 0 15px rgba(197, 160, 89, 0.3); }

        .categories-nav {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; 
            padding: 15px 20px; margin-bottom: 10px;
        }
        .cat-btn {
            background: var(--dark-card); border: 1px solid #333; color: #ccc;
            padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: var(--transition);
            font-size: 0.85rem; font-weight: bold;
        }
        .cat-btn:hover, .cat-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(197, 160, 89, 0.1); }

        main { padding: 20px 5%; max-width: 1200px; margin: 0 auto; }

        .section-title { color: var(--gold); font-size: 1.3rem; margin-bottom: 20px; border-right: 3px solid var(--gold); padding-right: 10px; }

        .books-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; margin-bottom: 40px; 
        }
        @media (min-width: 768px) { .books-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }

        .book-card { 
            background: var(--dark-card); border: 1px solid #222; border-radius: 12px; 
            overflow: hidden; transition: var(--transition); cursor: pointer; display: flex; 
            flex-direction: column; justify-content: space-between;
        }
        .book-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .book-cover { width: 100%; height: 220px; object-fit: cover; background: #1a1a1a; }
        .book-info { padding: 12px; }
        .book-title { font-size: 0.95rem; font-weight: bold; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-author { font-size: 0.8rem; color: #888; }

        /* Book Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; justify-content: center; align-items: center; padding: 15px; }
        .modal-box { background: var(--dark-card); border: 1px solid var(--gold); width: 100%; max-width: 550px; border-radius: 15px; padding: 25px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; left: 20px; top: 15px; cursor: pointer; color: #888; font-size: 22px; }
        .close-modal:hover { color: #fff; }

        .modal-book-detail { display: flex; gap: 20px; margin-bottom: 20px; }
        .modal-cover { width: 120px; height: 170px; object-fit: cover; border-radius: 8px; border: 1px solid #333; }
        .modal-meta { display: flex; flex-direction: column; justify-content: center; }
        .modal-title { font-size: 1.3rem; color: var(--gold); font-weight: bold; margin-bottom: 5px; }
        .modal-author { color: #aaa; font-size: 0.9rem; margin-bottom: 10px; }
        .modal-desc { color: #ccc; font-size: 0.85rem; line-height: 1.6; margin-bottom: 20px; }

        .btn-action { display: block; width: 100%; text-align: center; background: var(--gold); color: #000; padding: 12px; border-radius: 25px; font-weight: bold; text-decoration: none; transition: var(--transition); border: none; cursor: pointer; margin-top: 10px; }
        .btn-action:hover { background: var(--gold-bright); }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 12px 25px; border-radius: 30px; font-weight: bold; opacity: 0; transition: 0.4s; z-index: 10001; pointer-events: none; }
    </style>
</head>
<body>

    <div id="loader"><div class="loader-logo">LUNOVRA</div></div>

    <header>
        <div class="logo-text">LUNOVRA LIBRARY</div>
    </header>

    <div class="hero-banner">
        <h1>مكتبة العلوم والروايات العالمية</h1>
        <p>تصفح واقرأ أشهر الكتب والروايات الأصلية مجاناً وبجودة عالية</p>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن اسم كتاب أو كاتب..." oninput="filterBooks()">
        </div>
    </div>

    <div class="categories-nav">
        <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('novels', this)">الروايات والأنمي</button>
        <button class="cat-btn" onclick="filterCategory('tech', this)">التكنولوجيا والبرمجة</button>
        <button class="cat-btn" onclick="filterCategory('history', this)">التاريخ والعلوم</button>
        <button class="cat-btn" onclick="filterCategory('self', this)">تطوير الذات</button>
    </div>

    <main>
        <div class="section-title" id="sectionHeading">جميع الكتب المتاحة</div>
        <div class="books-grid" id="booksGrid"></div>
    </main>

    <!-- Modal التفاصيل والقراءة -->
    <div id="bookModal" class="modal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <div class="modal-book-detail">
                <img id="mCover" src="" class="modal-cover" alt="غلاف الكتاب">
                <div class="modal-meta">
                    <div id="mTitle" class="modal-title">عنوان الكتاب</div>
                    <div id="mAuthor" class="modal-author">الكاتب</div>
                    <span id="mCat" style="color: var(--gold); font-size: 0.75rem; background: rgba(197,160,89,0.1); padding: 3px 10px; border-radius: 10px; width: fit-content;">قسم</span>
                </div>
            </div>
            <div id="mDesc" class="modal-desc">وصف الكتاب وملخصه...</div>
            <button class="btn-action" onclick="readBook()">قراءة / تحميل الكتاب الآن 📖</button>
        </div>
    </div>

    <div id="toast">تم تجهيز رابط الكتاب!</div>

    <script>
        // قائمة الكتب الأوّلية الشاملة
        const books = [
            { id: 1, title: "مقدمة ابن خلدون", author: "ابن خلدون", cat: "history", cover: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400", desc: "أحد أشهر كتب التاريخ والاجتماع البشري وتأسيس علم العمران الإنساني.", link: "#" },
            { id: 2, title: "تعلم لغة JavaScript الحديثة", author: "فريق لوناڤرا", cat: "tech", cover: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=400", desc: "دليل شامل لبناء التطبيقات والمواقع باستخدام أحدث تقنيات البرمجة.", link: "#" },
            { id: 3, title: "فن الحرب", author: "سون تزو", cat: "self", cover: "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=400", desc: "كتاب إستراتيجي عسكري وتكتيكي أثّر في مجالات التفكير والإدارة الحديثة.", link: "#" },
            { id: 4, title: "ألف ليلة وليلة", author: "تراث عالمي", cat: "novels", cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400", desc: "مجموعة من الحكايات والقصص الخيالية الممتعة المستمدة من الشرق القديم.", link: "#" },
            { id: 5, title: "عالم الذكاء الاصطناعي", author: "د. أحمد كمال", cat: "tech", cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400", desc: "شرح مفصل لتقنيات تعلم الآلة وكيفية بناء نماذج الذكاء الاصطناعي المستقبلية.", link: "#" },
            { id: 6, title: "قوة العقل الباطن", author: "جوزيف ميرفي", cat: "self", cover: "https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400", desc: "كيف تستخدم تفكيرك وإيمانك الداخلي لتحقيق أهدافك وتغيير حياتك للأفضل.", link: "#" }
        ];

        let selectedCategory = 'all';
        let activeBook = null;

        function renderBooks(list) {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = '<p style="color: #777; grid-column: 1/-1; text-align: center; padding: 40px;">لم يتم العثور على كتب طابق بحثك.</p>';
                return;
            }

            list.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.onclick = () => openModal(book);
                card.innerHTML = `
                    <img src="${book.cover}" class="book-cover" alt="${book.title}">
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">${book.author}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            filterBooks();
        }

        function filterBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = books.filter(b => {
                const matchCat = selectedCategory === 'all' || b.cat === selectedCategory;
                const matchQuery = b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });

            renderBooks(filtered);
        }

        function openModal(book) {
            activeBook = book;
            document.getElementById('mCover').src = book.cover;
            document.getElementById('mTitle').innerText = book.title;
            document.getElementById('mAuthor').innerText = `الكاتب: ${book.author}`;
            document.getElementById('mCat').innerText = getCatName(book.cat);
            document.getElementById('mDesc').innerText = book.desc;

            document.getElementById('bookModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('bookModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function getCatName(cat) {
            const names = { novels: 'روايات وأنمي', tech: 'تكنولوجيا', history: 'تاريخ وعلوم', self: 'تطوير الذات' };
            return names[cat] || 'عام';
        }

        function readBook() {
            const t = document.getElementById('toast');
            t.innerText = `جاري فتح كتاب: ${activeBook.title}`;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        window.onload = () => {
            renderBooks(books);
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 800);
            }, 800);
        };
    </script>

    <!-- Monetag Ads -->
    <script>(function(s){s.dataset.zone='11534787',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <script>(function(s){s.dataset.zone='11534856',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

</body>
</html>
