<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUNOVRA | المشغّل الصوتي</title>
    <meta name="monetag" content="3f4088c86eb10f970c25df2fc645fcca">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #c5a059;
            --gold-bright: #ffdfa0;
            --dark: #0a0a0a;
            --dark-card: #141414;
            --white: #ffffff;
            --transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark); color: var(--white); overflow-x: hidden; min-height: 100vh; }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); display: flex; justify-content: center; align-items: center; z-index: 10000;
            transition: opacity 0.8s ease;
        }
        .loader-logo { font-family: 'Cinzel', serif; font-size: 35px; color: var(--gold); letter-spacing: 8px; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        header { 
            position: sticky; top: 0; z-index: 2000; background: rgba(10, 10, 10, 0.95); 
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3); backdrop-filter: blur(10px);
        }
        .logo-text { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold); letter-spacing: 3px; }

        main { padding: 30px 5%; max-width: 800px; margin: 0 auto; }
        
        .section-title { color: var(--gold); font-size: 1.3rem; margin-bottom: 20px; border-right: 3px solid var(--gold); padding-right: 10px; }

        .audio-container { display: flex; flex-direction: column; gap: 15px; }

        .audio-card {
            background: var(--dark-card); border: 1px solid #222; border-radius: 12px;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            transition: var(--transition);
        }
        .audio-card:hover { border-color: var(--gold); transform: translateX(-5px); }

        .audio-info { display: flex; flex-direction: column; gap: 5px; }
        .audio-title { font-weight: bold; color: var(--white); font-size: 1rem; }
        .audio-sub { font-size: 0.8rem; color: #888; }

        .play-btn {
            background: var(--gold); color: #000; border: none; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; cursor: pointer; transition: var(--transition);
        }
        .play-btn:hover { background: var(--gold-bright); }
    </style>
</head>
<body>

    <div id="loader"><div class="loader-logo">LUNOVRA</div></div>

    <header>
        <div class="logo-text">LUNOVRA AUDIO</div>
    </header>

    <main>
        <div class="section-title">قائمة المقاطع الصوتية</div>
        <div class="audio-container" id="audioContainer"></div>
    </main>

    <script>
        const audioTracks = [
            { id: 1, title: "مقطع صوتي 1", duration: "03:15", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { id: 2, title: "مقطع صوتي 2", duration: "04:20", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { id: 3, title: "مقطع صوتي 3", duration: "02:45", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
        ];

        let currentAudio = null;
        let currentBtn = null;

        function renderTracks() {
            const container = document.getElementById('audioContainer');
            container.innerHTML = '';

            audioTracks.forEach(track => {
                const card = document.createElement('div');
                card.className = 'audio-card';
                card.innerHTML = `
                    <div class="audio-info">
                        <span class="audio-title">${track.title}</span>
                        <span class="audio-sub">المدة: ${track.duration}</span>
                    </div>
                    <button class="play-btn" onclick="playTrack('${track.src}', this)">تشغيل ▶</button>
                `;
                container.appendChild(card);
            });
        }

        function playTrack(src, btn) {
            // إيقاف الصوت الحالي إن وجد لمنع التداخل
            if (currentAudio) {
                currentAudio.pause();
                if (currentBtn) currentBtn.innerText = "تشغيل ▶";
            }

            if (currentBtn === btn && !currentAudio.paused) {
                currentAudio.pause();
                btn.innerText = "تشغيل ▶";
                return;
            }

            currentAudio = new Audio(src);
            currentAudio.play();
            btn.innerText = "إيقاف ⏸";
            currentBtn = btn;

            currentAudio.onended = () => {
                btn.innerText = "تشغيل ▶";
            };
        }

        window.onload = () => {
            renderTracks();
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 800);
            }, 800);
        };
    </script>

    <!-- Monetag Ads -->
    <script>(function(s){s.dataset.zone='11534787',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <script>(function(s){s.dataset.zone='11534856',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

</body>
</html>
