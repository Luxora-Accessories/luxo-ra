<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUNOVRA GAMES | منصة الألعاب الكلاسيكية</title>
    <meta name="monetag" content="3f4088c86eb10f970c25df2fc645fcca">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #c5a059;
            --gold-bright: #ffdfa0;
            --dark: #0a0a0a;
            --dark-card: #141414;
            --cream: #fdfdfd;
            --white: #ffffff;
            --transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--dark); 
            color: var(--white); 
            overflow-x: hidden;
            line-height: 1.5;
        }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
            transition: opacity 0.8s ease;
        }
        .loader-logo { 
            font-family: 'Cinzel', serif; font-size: 35px; color: var(--gold); 
            letter-spacing: 8px; animation: pulse 2s infinite ease-in-out; 
        }
        @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } }

        header { 
            position: sticky; top: 0; z-index: 2000;
            background: rgba(10, 10, 10, 0.95); padding: 15px 5%; 
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .logo-text { 
            font-family: 'Cinzel', serif; font-size: 26px; color: var(--gold); 
            letter-spacing: 4px; text-align: center; user-select: none; 
        }
        
        .search-box {
            width: 100%; max-width: 500px;
            position: relative;
        }
        .search-box input {
            width: 100%; padding: 10px 20px;
            border-radius: 25px; border: 1px solid var(--gold);
            background: rgba(255,255,255,0.05); color: white;
            outline: none; font-size: 14px; text-align: center;
        }

        .hero-banner {
            text-align: center; padding: 30px 15px 10px;
            background: linear-gradient(180deg, rgba(197, 160, 89, 0.1) 0%, rgba(10,10,10,0) 100%);
        }
        .hero-banner h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.8rem; margin-bottom: 5px; }
        .hero-banner p { color: #aaa; font-size: 0.9rem; }

        main { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 15px; padding: 20px; max-width: 1300px; margin: 0 auto;
        }
        @media (min-width: 768px) { main { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
        @media (min-width: 1024px) { main { grid-template-columns: repeat(4, 1fr); gap: 25px; } }

        .game-card { 
            background: var(--dark-card); border: 1px solid #222; padding: 10px; 
            text-align: center; transition: var(--transition); border-radius: 12px;
            cursor: pointer; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 10px 20px rgba(197, 160, 89, 0.2);
        }
        
        .img-container { width: 100%; height: 140px; overflow: hidden; border-radius: 8px; margin-bottom: 10px; }
        @media (min-width: 768px) { .img-container { height: 180px; } }
        
        .game-card img { 
            width: 100%; height: 100%; object-fit: cover; 
            transition: transform 0.5s ease;
        }
        .game-card:hover img { transform: scale(1.08); }

        .game-card h3 { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .game-card .category { color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

        .play-btn {
            background: transparent; color: var(--gold); border: 1px solid var(--gold);
            padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;
            margin-top: 8px; transition: var(--transition);
        }
        .game-card:hover .play-btn { background: var(--gold); color: #000; }

        /* Game Modal Frame */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.92); z-index: 5000; justify-content: center; align-items: center; 
            backdrop-filter: blur(8px); padding: 10px;
        }
        
        .modal-content { 
            background: var(--dark-card); width: 100%; max-width: 900px; height: 90vh; 
            border-radius: 12px; overflow: hidden; position: relative;
            display: flex; flex-direction: column; border: 1px solid var(--gold);
        }

        .modal-header {
            padding: 10px 20px; background: #080808; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #222;
        }
        .modal-header h2 { color: var(--gold); font-size: 1.1rem; }

        .close-btn {
            width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold);
            color: var(--gold); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-weight: bold;
        }
        .close-btn:hover { background: var(--gold); color: #000; }

        .iframe-container { flex: 1; width: 100%; height: 100%; background: #000; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="loader"><div class="loader-logo">LUNOVRA</div></div>

    <header>
        <div class="logo-text">LUNOVRA GAMES</div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="ابحث عن لعبه..." onkeyup="filterGames()">
        </div>
    </header>

    <div class="hero-banner">
        <h1>Retro & Arcade Games</h1>
        <p>العب أكثر الألعاب الكلاسيكية متعة مباشرة على المتصفح</p>
    </div>

    <main id="games-grid"></main>

    <div id="game-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">اسم اللعبة</h2>
                <div class="close-btn" onclick="closeGame()">✕</div>
            </div>
            <div class="iframe-container">
                <iframe id="game-frame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const games = [
            {
                id: 1,
                title: "Pac-Man Classic",
                category: "Arcade / كلاسيك",
                img: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=500&q=80",
                url: "https://pacman.com/en/"
            },
            {
                id: 2,
                title: "2048 Puzzle",
                category: "Puzzle / ذكاء",
                img: "https://images.unsplash.com/photo-1611996575749-79a3a250f948?w=500&q=80",
                url: "https://play2048.co/"
            },
            {
                id: 3,
                title: "Snake Game",
                category: "Retro / ريترو",
                img: "https://images.unsplash.com/photo-1628155930542-3c7a64e2c833?w=500&q=80",
                url: "https://playsnake.org/"
            },
            {
                id: 4,
                title: "Tic Tac Toe (X O)",
                category: "Strategy / تحدي",
                img: "https://images.unsplash.com/photo-1668906093328-99601a1aa584?w=500&q=80",
                url: "https://playtictactoe.org/"
            },
            {
                id: 5,
                title: "Flappy Bird Web",
                category: "Arcade / تحدي",
                img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&q=80",
                url: "https://flappybird.io/"
            },
            {
                id: 6,
                title: "Tetris JS",
                category: "Classic / ألغاز",
                img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&q=80",
                url: "https://tetris.com/play-tetris"
            }
        ];

        function renderGames(list) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = list.map(g => `
                <div class="game-card" onclick="openGame('${g.title}', '${g.url}')">
                    <div class="img-container">
                        <img src="${g.img}" alt="${g.title}" loading="lazy">
                    </div>
                    <div>
                        <h3>${g.title}</h3>
                        <div class="category">${g.category}</div>
                    </div>
                    <button class="play-btn">إبدأ اللعب 🎮</button>
                </div>
            `).join('');
        }

        function openGame(title, url) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('game-frame').src = url;
            document.getElementById('game-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('game-modal').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }

        function filterGames() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = games.filter(g => g.title.toLowerCase().includes(query) || g.category.toLowerCase().includes(query));
            renderGames(filtered);
        }

        window.onload = () => {
            renderGames(games);
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 800);
            }, 800);
        };
    </script>

    <!-- Monetag Ad 1: In-Page Push -->
    <script>(function(s){s.dataset.zone='11534787',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <!-- Monetag Ad 2: Vignette Banner -->
    <script>(function(s){s.dataset.zone='11534856',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

</body>
</html>
